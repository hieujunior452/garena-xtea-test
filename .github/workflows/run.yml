name: Run XTEA native
on: [workflow_dispatch, push]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu + cross libs
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6-dev-arm64-cross gcc-aarch64-linux-gnu
          ls /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1
      - name: Diagnostics
        run: |
          ls -la
          file ./test_xtea
          find /usr/aarch64-linux-gnu -name 'ld-linux*' 2>/dev/null
          find / -name 'ld-linux-aarch64.so*' 2>/dev/null | head
      - name: Run test_xtea
        run: |
          chmod +x ./test_xtea
          export LD_LIBRARY_PATH=$PWD
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./test_xtea 696d34834954176785e0c2ec851ac7135737acb497a92194c9982aeb4fb1e4f504a0436de95f8beeb2921edbde4061ce38840be47564f655aa56a29ae6e18ce1 47b1883bb3d334841dbb0873ed1a356c > output.txt 2>&1 || true
          echo "=== OUTPUT ==="
          cat output.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: .